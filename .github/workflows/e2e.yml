name: E2E
on: workflow_dispatch
permissions:
  contents: read
jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            src/uSupport/Client/package-lock.json
            src/uSupport.E2E/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/uSupport/Client

      - name: Build frontend assets
        run: npm run build
        working-directory: src/uSupport/Client

      # Site runs on https://localhost:44318, Kestrel needs a dev cert (untrusted is fine, tests ignore HTTPS errors)
      - name: Create HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Build site
        run: dotnet build src/uSupport.Web

      - name: Install E2E dependencies
        run: npm ci
        working-directory: src/uSupport.E2E

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/uSupport.E2E

      # Playwright's webServer starts the site and runs the unattended install
      - name: Run E2E tests
        run: npx playwright test
        working-directory: src/uSupport.E2E

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/uSupport.E2E/playwright-report
          retention-days: 14

name: Release
on:
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  release_name:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/uSupport/Client/package-lock.json'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/uSupport/Client

      - name: Build frontend assets
        run: npm run build
        working-directory: src/uSupport/Client
      - name: Run tests
        run: dotnet test --configuration Release src/uSupport.Tests
      - name: Build project
        run: dotnet build --configuration Release src/uSupport
      - name: Package files
        run: dotnet pack --configuration Release  src/uSupport /p:Version=${{github.ref_name}}
      - name: Publish the package
        run: dotnet nuget push src/uSupport/build/Release/uSupport.${{github.ref_name}}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{secrets.PRIVATE_NUGET_KEY }}
